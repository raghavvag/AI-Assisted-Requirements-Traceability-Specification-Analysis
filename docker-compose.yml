version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: traceability_qdrant
    restart: unless-stopped
    ports:
      - "6338:6338"   # REST / HTTP API  (QDRANT_URL=http://localhost:6338)
      - "6339:6339"   # gRPC (optional, for tooling)
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6338
      - QDRANT__SERVICE__GRPC_PORT=6339
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6338/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  qdrant_data:
    driver: local
